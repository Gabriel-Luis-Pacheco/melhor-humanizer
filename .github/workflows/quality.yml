name: Quality checks

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile scripts
        run: python -m compileall -q scripts eval
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Corpus validation
        run: python eval/check_runs.py --validate-corpus
      - name: Package validation
        run: python scripts/validate_skill.py
      - name: Skill frontmatter sanity check
        run: |
          python - <<'PY'
          from pathlib import Path
          s = Path("SKILL.md").read_text(encoding="utf-8")
          assert s.startswith("---\n")
          header = s.split("---", 2)[1]
          assert "name: melhor-humanizer" in header
          assert "description:" in header
          assert len(s.splitlines()) < 500
          print("Skill structure OK")
          PY
