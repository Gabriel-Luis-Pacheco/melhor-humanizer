name: Quality checks

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile scripts
        run: python -m compileall -q scripts
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Skill frontmatter sanity check
        run: |
          python - <<'PY'
          from pathlib import Path
          s = Path("SKILL.md").read_text(encoding="utf-8")
          assert s.startswith("---\n")
          header = s.split("---", 2)[1]
          assert "name: melhor-humanizer" in header
          assert "description:" in header
          assert len(s.splitlines()) < 500
          print("Skill structure OK")
          PY
